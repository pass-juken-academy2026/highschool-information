<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="高校情報Ⅰのオリジナル受験対策演習。共通テスト風演習・模擬テスト・採点・解説。"><title>高校情報Ⅰ｜演習・模擬テスト</title><style>

</style><style id="responsive-layout-polish">/* Responsive layout and touch-target polish; learning data unchanged. */*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:5rem}body{max-width:100%;overflow-wrap:anywhere}img,svg,canvas,video{max-width:100%;height:auto}button,input,select,textarea{font:inherit;max-width:100%;min-width:0}button,a,[role="button"]{touch-action:manipulation}button{min-height:42px}:where(button,a,input,select,textarea,[role="button"],[tabindex]):focus-visible{outline:3px solid #65c9f1;outline-offset:3px}@media(max-width:640px){body{font-size:16px;line-height:1.65}header,main{padding-left:max(16px,env(safe-area-inset-left))!important;padding-right:max(16px,env(safe-area-inset-right))!important}h1{font-size:clamp(1.55rem,7vw,2.25rem)!important;line-height:1.2}h2{font-size:clamp(1.15rem,5vw,1.45rem)}.grid,.cards,.subject-grid,.subjects,.menu-grid,.topic-grid,.cards-grid,.dashboard,.two-col,.three-col{grid-template-columns:minmax(0,1fr)!important}.card,.panel,.topic-card,.menu-card{min-width:0;overflow-wrap:anywhere}button{min-height:44px}.choices button{width:100%;text-align:left;white-space:normal}table{display:block;max-width:100%;overflow-x:auto}pre,code{overflow-wrap:anywhere;white-space:pre-wrap}input,select,textarea{font-size:16px}}</style></head><body><main><div class="top"><a href="./index.html">← 科目トップへ戻る</a><span class="pill">オリジナル問題</span></div><h1>高校情報Ⅰ 演習ラボ</h1><p class="muted">知識の確認から資料・文章を読み取る問題まで。解答後に採点し、解説と復習問題を確認できます。</p><section class="panel" id="setup"><h2>演習を設定</h2><label for="mode">演習モード</label><select id="mode"><option value="common">共通テスト風演習</option><option value="mock">模擬テスト・弱点分析</option><option value="basic">基礎確認</option></select><p id="modeInfo" class="muted">知識・読解・資料活用を組み合わせたオリジナル問題</p><button id="start">テストを開始</button></section><section class="panel hidden" id="quiz" aria-live="polite"><div class="top"><span id="counter" class="pill"></span><span id="scoreLive" class="muted"></span></div><div class="progress"><span id="bar"></span></div><h2 id="question"></h2><div id="choices"></div><div id="feedback" class="explain hidden"></div><div class="row" style="margin-top:18px"><button id="check">解答する</button><button id="next" disabled>次の問題 →</button></div></section><section class="panel hidden" id="result"><h2>結果・弱点分析</h2><p id="summary"></p><p id="analysis" class="muted"></p><h3>間違えた問題</h3><div id="missed"></div><div class="row"><button id="review">間違えた問題を復習</button><button id="again">もう一度挑戦</button></div></section><p class="muted">※本番問題の転載ではなく、学習用に作成したオリジナル問題です。出題範囲は今後拡充します。</p></main><script>
const BANK=[["個人情報を扱う際に適切な行動は？",["必要な範囲だけ収集し目的を明確にする","本人に知らせず無制限に公開する","パスワードを全員に共有する","公開範囲を毎回最大にする"],0,"個人情報は利用目的や必要性を考え、適切に管理する。"],["2進数 101₂ を10進数にすると？",["3","4","5","6"],2,"1×2²+0×2¹+1×2⁰=5。"],["アルゴリズムの説明として適切なのは？",["問題を解くための手順","データを保存する機器だけ","必ずプログラミング言語の名前","画像の解像度"],0,"アルゴリズムは問題を解決するための明確な手順。"],["表計算でセルA1からA5の合計を求める関数は？",["=ADD(A1-A5)","=SUM(A1:A5)","=TOTAL(A1;A5)","=COUNT(A1:A5)"],1,"SUM関数で指定範囲の数値を合計する。"],["フィッシング詐欺への対策として最も適切なのは？",["メールのリンクをすぐ開いて入力する","送信元とURLを確認し、公式経路からアクセスする","同じパスワードを全サービスで使う","警告を無視する"],1,"不審なリンクを避け、公式アプリやブックマークから確認する。"],["公開鍵暗号方式の特徴として適切なのは？",["暗号化鍵と復号鍵に異なる鍵を用いる","全員が同じ秘密鍵を必ず公開する","暗号化を使わない","データのバックアップだけを指す"],0,"公開鍵と秘密鍵のペアを使う方式。"],["【データ活用】あるクラスのアンケートで回答者の80%が「賛成」と答えた。全校生徒も80%が賛成と結論づける際の問題は？",["回答者が全校を代表するとは限らない","割合を使っている","数字がある","アンケートである"],0,"回答者の選ばれ方や回答数が偏っていると全校に一般化できない。"],["【プログラミング】変数xが3で、処理 x←x+2 を実行した後のxは？",["1","3","5","6"],2,"xの値3に2を加えるので5。"],["【ネットワーク】HTTPSを利用する主な利点は？",["通信を暗号化し盗聴・改ざんのリスクを低減する","相手が必ず善人だと保証する","ウイルスを必ず除去する","パスワード入力が不要になる"],0,"HTTPSは通信を暗号化し、サーバー認証などを通じて通信の安全性を高める。"],["【情報デザイン】比較する数値を棒グラフで示す際に重要なのは？",["軸・単位・尺度を明示する","都合のよい値だけ隠す","単位を混在させる","目盛りを説明しない"],0,"軸や単位、尺度を明示すると、読み手が適切に比較できる。"]
,["【プログラムトレース】x=2から始め、iを1から3まで1ずつ増やしながら毎回 x←x+i を実行する。最後のxは？",["5","6","7","8"],3,"順にx=3、5、8となる。ループを1回ずつ追い、更新後の値を記録する。"],["【アルゴリズム】入力値xが0以上なら「非負」、0未満なら「負」と表示する条件分岐は？",["if x>0 then 非負 else 負","if x>=0 then 非負 else 負","if x<0 then 非負 else 非負","常に非負と表示する"],1,"0も非負に含まれるので、条件は x>=0。境界値0で動作を確認する。"],["【データ分析】データに極端に大きい値が1つ含まれる場合、中心の代表値として影響を受けにくいものは？",["平均値","中央値","最大値","合計値"],1,"中央値は並べたときの中央の値で、極端な外れ値の影響を平均値より受けにくい。"],["【情報セキュリティ】パスワードが漏えいした場合の被害を減らす対策として適切なのは？",["多要素認証を有効にする","すべてのサービスで同じパスワードを使う","パスワードを友人と共有する","更新通知をすべて無視する"],0,"多要素認証は、パスワード以外の要素も確認するため、不正ログインのリスク低減に役立つ。"],["【ネットワーク・プロトコル】DNSの主な役割は？",["ドメイン名とIPアドレスの対応を調べる","画像を必ず圧縮する","端末の電池を充電する","すべての通信を暗号化する"],0,"DNSはドメイン名に対応するIPアドレスなどを問い合わせる仕組み。通信の暗号化はDNSそのものの役割ではない。"],["【情報デザイン・共通テスト】2つの商品の売上を月ごとに比較するグラフで、誤解を減らす工夫は？",["縦軸の単位・目盛りと期間を明示する","比較しやすいよう片方のデータを隠す","縦軸を説明なく途中から始める","凡例をなくして色だけで示す"],0,"軸の単位・目盛り、期間、凡例を明示し、尺度の取り方で差を誇張しないことが大切。"],["【2進数】2進数 1101₂ を10進数にすると？",["11","12","13","14"],2,"1101₂=1×8+1×4+0×2+1=13。"],["【論理演算】A=1、B=0のとき、A AND B の値は？",["0","1","2","定義されない"],0,"ANDは両方が1のときだけ1。A=1、B=0なので0。"],["【論理演算】A=0のとき、NOT A の値は？",["0","1","Aのまま","定義されない"],1,"NOTは真偽を反転するので、0の否定は1。"],["【データ表現】8ビットで表せる異なるビット列は何通り？",["8","16","128","256"],3,"各ビットに0か1の2通りがあり、2⁸=256通り。"],["【画像データ】横100画素、縦50画素、1画素あたり24ビットの非圧縮画像のデータ量は？",["12,000ビット","120,000ビット","1,200,000ビット","12,000バイト"],1,"100×50×24=120,000ビット。ファイル形式の付加情報などは含めない。"],["【圧縮】元のデータを完全に復元できる圧縮方式は？",["非可逆圧縮","可逆圧縮","暗号化","標本化"],1,"可逆圧縮は圧縮前のデータを完全に復元できる。"],["【データベース】表の中で各レコードを一意に識別するために使う項目は？",["主キー","外部リンク","見出し画像","コメント欄"],0,"主キーは各レコードを重複なく識別するための項目。"],["【著作権】他人の文章や画像を利用するときに適切なのは？",["ネット上なら自由に転載する","出典や利用条件を確認し、必要な許諾を得る","作者名を消して使う","加工すれば必ず自由に使える"],1,"公開されているだけで自由利用できるとは限らない。権利やライセンス、引用条件を確認する。"],["【暗号】共通鍵暗号方式の特徴として正しいものは？",["暗号化と復号に同じ鍵を使う","鍵を一切使わない","必ず公開鍵と秘密鍵の2本を使う","データを圧縮するだけの方式"],0,"共通鍵暗号では暗号化と復号に同じ共通鍵を使う。鍵の安全な共有が重要。"],["【ネットワーク】パケット交換方式の説明として適切なのは？",["データを小さな単位に分けて送り、受信側で組み立てる","通信中は必ず専用回線を占有する","通信内容を必ず印刷する","IPアドレスを使わない方式"],0,"データをパケットに分けて送信し、受信側で再構成する方式。"],["【プログラム】x=0として、i=1,2,3の順に x←x+2 を実行した後のxは？",["2","3","5","6"],3,"2を3回加えるのでx=6。"],["【情報デザイン】数値の変化を時間順に示すとき、一般に向いているグラフは？",["折れ線グラフ","円グラフだけ","地図記号","散布図だけ"],0,"時間に沿った変化や傾向を示すには折れ線グラフが適している。"],
["【プログラムトレース】x=4 とする。次に x=x×3、x=x−5 を順に実行した後のxは？",["5","7","12","17"],1,"最初に4×3=12、次に12−5=7となる。"],
["【アルゴリズム】iを1から3まで1ずつ増やし、各回で合計に2iを加える。合計の最終値は？",["6","9","12","18"],2,"合計は2×1+2×2+2×3=2+4+6=12。"],
["【条件分岐】score=75 とし、「scoreが80以上ならA、そうでなければB」とする。表示される文字は？",["A","B","75","エラー"],1,"75は80以上ではないので、else側のBが表示される。"],
["【2進数計算】2進数 10110₂ を10進数に変換すると？",["18","20","22","24"],2,"1×2⁴+0×2³+1×2²+1×2¹+0×2⁰=16+4+2=22。"],
["【表計算】セルB2〜B4に12、18、20が入力されている。合計を求めた値は？",["30","38","50","60"],2,"合計は12+18+20=50。範囲を合計するには=SUM(B2:B4)を使う。"],
["【論理演算】A=1、B=0 のとき、A AND B の結果は？",["0","1","10","定義できない"],0,"ANDは両方が1のときだけ1になるため、1 AND 0 は0。"]
]; 
const $=id=>document.getElementById(id);let questions=[],idx=0,answers=[],locked=false,reviewOnly=false;
const modes={common:"知識・読解・資料活用を組み合わせたオリジナル問題",mock:"基礎から応用までを確認し、苦手分野を振り返ります",basic:"重要用語・基本事項をテンポよく確認します"};
$("mode").addEventListener("change",()=> $("modeInfo").textContent=modes[$("mode").value]);
// practice-mode-from-menu-20261010: honor the mode selected on the existing study menu
(function(){const p=new URLSearchParams(location.search),v=p.get("mode"),t=p.get("topic"),label=p.get("label");if(["common","mock","basic"].includes(v))$("mode").value=v;$("modeInfo").textContent=modes[$("mode").value]||modes.basic;if(t){const h=document.querySelector("header h1, h1");if(h)h.textContent=(label||"演習")+"｜"+t;}})();

const COMMON_STIMULUS={title:"【大問1 表計算データの分析】",text:"あるクラスで、学習時間と確認テストの得点を記録した。次の値は操作練習用の模式データであり、学習時間だけが得点を決めると示すものではない。",table:"<svg viewBox=\"0 0 360 190\" role=\"img\" aria-label=\"学習時間と確認テスト得点のグラフ\"><line x1=\"42\" y1=\"150\" x2=\"340\" y2=\"150\" stroke=\"currentColor\"/><line x1=\"42\" y1=\"20\" x2=\"42\" y2=\"150\" stroke=\"currentColor\"/><text x=\"6\" y=\"24\" font-size=\"10\" fill=\"currentColor\">得点</text><polyline points=\"75,112 180,62 285,39\" fill=\"none\" stroke=\"#5ca9e6\" stroke-width=\"3\"/><g fill=\"#5ca9e6\"><circle cx=\"75\" cy=\"112\" r=\"5\"/><circle cx=\"180\" cy=\"62\" r=\"5\"/><circle cx=\"285\" cy=\"39\" r=\"5\"/></g><g fill=\"currentColor\" font-size=\"11\" text-anchor=\"middle\"><text x=\"75\" y=\"130\">55</text><text x=\"180\" y=\"80\">68</text><text x=\"285\" y=\"57\">74</text><text x=\"75\" y=\"166\">1h</text><text x=\"180\" y=\"166\">2h</text><text x=\"285\" y=\"166\">3h</text><text x=\"190\" y=\"185\">学習時間</text></g></svg><p>データ：1時間=55点、2時間=68点、3時間=74点（模式データ）</p>"};
const COMMON_TEST=[["【大問1・問1】表から読み取れる傾向として適切なのは？",["学習時間が長い例ほど得点が高い","学習時間が長いほど必ず得点が下がる","得点はすべて同じ","学習時間と得点の関係は表から読めない"],0,"この3例では学習時間の増加とともに得点も高くなっている。"],["【大問1・問2】この表だけでは断定できないことは？",["記録された3例の得点","学習時間の値","学習時間が得点差の唯一の原因であること","3例の大小関係"],2,"他の学習方法や事前知識などの条件が示されていないため、原因を一つに限定できない。"],["【大問1・問3】データの分析として適切な次の手順は？",["データの出所や対象数、条件を確認する","都合の悪い値を理由なく削除する","相関があれば必ず因果関係とみなす","軸や単位を確認せず結論を出す"],0,"データの出所、対象数、条件、軸・単位などを確認し、結論の限界も考える。"]];
function start(list=null,review=false){const mode=$("mode").value;let source=list||BANK;if(!list&&mode==="basic")source=BANK.slice(0,6);if(!list&&mode==="common")source=COMMON_TEST;if(!list&&mode==="mock")source=[...BANK];questions=[...source].sort(()=>Math.random()-.5);if(!list&&mode==="mock")questions=questions.slice(0,1);if(!questions.length)questions=[...BANK];idx=0;answers=[];locked=false;reviewOnly=review;$("setup").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render()}
function render(){const q=questions[idx];locked=false;$("counter").textContent=(idx+1)+" / "+questions.length;$("scoreLive").textContent="回答済み "+answers.filter(a=>a&&a.selected!==undefined).length+"問";$("bar").style.width=(idx/questions.length*100)+"%";const qel=$("question");let st=$("commonStimulus");if(!st){st=document.createElement("section");st.id="commonStimulus";st.className="panel";qel.parentNode.insertBefore(st,qel);}const cm=$("mode").value==="common";st.style.display=cm?"block":"none";st.innerHTML=cm?"<h3>"+COMMON_STIMULUS.title+"</h3><p>"+COMMON_STIMULUS.text+"</p>"+COMMON_STIMULUS.table:"";$("question").textContent=q[0];$("choices").innerHTML="";q[1].forEach((t,i)=>{const b=document.createElement("button");b.className="choice";b.textContent=["A","B","C","D"][i]+"．"+t;b.addEventListener("click",()=>{if(locked)return;answers[idx]={selected:i};[...$("choices").children].forEach(x=>x.classList.remove("selected"));b.classList.add("selected")});$("choices").appendChild(b)});$("feedback").classList.add("hidden");$("feedback").textContent="";$("check").disabled=false;$("next").disabled=true;$("next").textContent=idx===questions.length-1?"結果を見る":"次の問題 →"}
$("start").addEventListener("click",()=>start());
$("check").addEventListener("click",()=>{if(locked)return;if(!answers[idx]||answers[idx].selected===undefined){$("feedback").textContent="選択肢を選んでね。";$("feedback").classList.remove("hidden");return}locked=true;const q=questions[idx],a=answers[idx];a.correct=a.selected===q[2];[...$("choices").children].forEach((b,i)=>{b.disabled=true;if(i===q[2])b.classList.add("correct");if(i===a.selected&&i!==q[2])b.classList.add("wrong")});$("feedback").textContent=(a.correct?"正解！":"不正解。正解は "+["A","B","C","D"][q[2]]+"。")+" "+q[3];$("feedback").classList.remove("hidden");$("check").disabled=true;$("next").disabled=false;$("scoreLive").textContent="現在 "+answers.filter(x=>x&&x.correct).length+"問正解"});
$("next").addEventListener("click",()=>{if(idx<questions.length-1){idx++;render()}else finish()});
function finish(){ $("quiz").classList.add("hidden");$("result").classList.remove("hidden");const good=answers.filter(a=>a&&a.correct).length;const wrong=questions.map((q,i)=>({q,a:answers[i]})).filter(x=>!x.a||!x.a.correct);$("summary").textContent=good+" / "+questions.length+"問正解（正答率 "+Math.round(good/questions.length*100)+"%）";$("analysis").textContent=good===questions.length?"全問正解！知識だけでなく、根拠を説明できるかも確認しよう。":wrong.length+"問を復習リストに入れました。解説を読み、なぜその選択肢が正しいかを自分の言葉で説明してみよう。";$("missed").innerHTML=wrong.length?wrong.map(x=>'<div class="explain" style="margin:10px 0"><strong>'+x.q[0]+'</strong><p>正解：'+x.q[1][x.q[2]]+'</p><p>'+x.q[3]+'</p></div>').join(""):"間違えた問題はありません。";$("review").disabled=!wrong.length;$("review").onclick=()=>start(wrong.map(x=>x.q),true);$("again").onclick=()=>start()}
</script></body></html>

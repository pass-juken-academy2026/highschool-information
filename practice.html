</style><style id="responsive-layout-polish">/* Responsive layout and touch-target polish; learning data unchanged. */*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:5rem}body{max-width:100%;overflow-wrap:anywhere}img,svg,canvas,video{max-width:100%;height:auto}button,input,select,textarea{font:inherit;max-width:100%;min-width:0}button,a,[role="button"]{touch-action:manipulation}button{min-height:42px}:where(button,a,input,select,textarea,[role="button"],[tabindex]):focus-visible{outline:3px solid #65c9f1;outline-offset:3px}@media(max-width:640px){body{font-size:16px;line-height:1.65}header,main{padding-left:max(16px,env(safe-area-inset-left))!important;padding-right:max(16px,env(safe-area-inset-right))!important}h1{font-size:clamp(1.55rem,7vw,2.25rem)!important;line-height:1.2}h2{font-size:clamp(1.15rem,5vw,1.45rem)}.grid,.cards,.subject-grid,.subjects,.menu-grid,.topic-grid,.cards-grid,.dashboard,.two-col,.three-col{grid-template-columns:minmax(0,1fr)!important}.card,.panel,.topic-card,.menu-card{min-width:0;overflow-wrap:anywhere}button{min-height:44px}.choices button{width:100%;text-align:left;white-space:normal}table{display:block;max-width:100%;overflow-x:auto}pre,code{overflow-wrap:anywhere;white-space:pre-wrap}input,select,textarea{font-size:16px}}</style><style id="pdf-export-controls">#pdfExportControls .row{gap:8px}#pdfExportControls button{flex:1 1 180px}</style></head><body><main><div class="top"><a href="./index.html">← 科目トップへ戻る</a><span class="pill">オリジナル問題</span></div><h1>高校情報Ⅰ 演習ラボ</h1><p class="muted">知識の確認から資料・文章を読み取る問題まで。解答後に採点し、解説と復習問題を確認できます。</p><section class="panel" id="setup"><h2>演習を設定</h2><label for="mode">演習モード</label><select id="mode"><option value="common">共通テスト風演習</option><option value="mock">模擬テスト・弱点分析</option><option value="basic">基礎確認</option><option value="level">難易度別演習</option></select><p id="modeInfo" class="muted">知識・読解・資料活用を組み合わせたオリジナル問題</p><div id="levelControls" class="hidden" style="margin:12px 0"><label for="difficulty">問題の難易度</label><select id="difficulty"><option value="1">基礎</option><option value="2" selected>標準</option><option value="3">応用</option></select><p class="muted">選択した難易度の問題だけを出題します。問題を一巡するまで同じ問題は再出題しません。</p></div><button id="start">テストを開始</button></section><section class="panel hidden" id="pdfExportControls"><h2>問題・解答をPDFに保存</h2><p class="muted">演習セット全体を印刷画面に整形します。「PDFに保存」を選ぶと保存できます。</p><div class="row"><button type="button" id="pdfQuestions">問題のみ</button><button type="button" id="pdfAnswers">解答・解説のみ</button><button type="button" id="pdfCombined">問題＋解答・解説</button></div><h3>テキストとしてコピー</h3><div class="row"><button type="button" id="copyQuestions">問題のみテキスト</button><button type="button" id="copyAnswers">解答・解説テキスト</button><button type="button" id="copyCombined">問題＋解答・解説テキスト</button></div><p id="copyTextStatus" aria-live="polite" class="muted"></p></section><section class="panel hidden" id="quiz" aria-live="polite"><div class="top"><span id="counter" class="pill"></span><span id="scoreLive" class="muted"></span></div><div class="progress"><span id="bar"></span></div><h2 id="question"></h2><div id="choices"></div><div id="feedback" class="explain hidden"></div><div class="row" style="margin-top:18px"><button id="check">解答する</button><button id="next" disabled>次の問題 →</button></div></section><section class="panel hidden" id="result"><h2>結果・弱点分析</h2><p id="summary"></p><p id="analysis" class="muted"></p><h3>間違えた問題</h3><div id="missed"></div><div class="row"><button id="review">間違えた問題を復習</button><button id="again">もう一度挑戦</button></div></section><p class="muted">※本番問題の転載ではなく、学習用に作成したオリジナル問題です。出題範囲は今後拡充します。</p></main><script>
const BANK=[["学校が学習アプリで生徒の情報を集める。個人情報の取扱いとして最も適切なのは？",["利用目的を明示し、必要な情報に絞って収集し、保存期間や閲覧権限も定める","将来使う可能性があるため、目的を決めずに全項目を集める","担当業務に関係なく、教職員全員が個人を識別できる情報を閲覧できるようにする","利用目的を達成した後も、理由を定めず個人情報を永久保存する"],0,"目的を明確にし、必要最小限の情報を扱う。アクセス権限と保存期間も定め、目的外利用や過剰な保存を避ける。"],["2進数 101₂ を10進数にすると？",["3","5","4","6"],1,"1×2²+0×2¹+1×2⁰=5。"],["アルゴリズムを設計するとき、実行する人やコンピュータが手順を誤解しにくくするために重要なのは？",["目的だけを書き、処理の順序は実行者に任せる","例外が起きたときの処理を省き、通常時だけを示す","処理の順序や条件分岐、終了条件を明確に表す","必ず特定のプログラミング言語の文法だけで記述する"],2,"アルゴリズムは問題を解決するための手順であり、処理の順序・条件分岐・終了条件を明確にすることが重要。"],["表計算ソフトで、セルA1からA5までに入力された数値の合計を求める式は？",["=COUNT(A1:A5)","=AVERAGE(A1:A5)","=SUM(A1:A5)","=MAX(A1:A5)"],2,"SUM関数は指定範囲の数値を合計する。COUNTは個数、AVERAGEは平均、MAXは最大値を求める。"],["利用中のサービスを名乗るメールに「本日中に確認しないと利用停止」と書かれ、リンクからログインするよう求められた。最も適切な対応は？",["リンクを開き、表示された画面のロゴを確認してからログインする","メールには返信せず、公式アプリやブックマークからサービスにアクセスして通知の真偽を確認する","送信元の表示名が公式名なら、リンク先のドメインを確認せずログインする","同じメールを同僚に転送し、誰かがログインして安全か確かめてもらう"],1,"表示名やロゴは偽装できる。メール内のリンクを使わず、公式アプリや既知の公式URLから独立して確認する。"],["公開鍵暗号方式で、送信者が受信者だけに読めるよう機密文書を暗号化するとき、原則として使う鍵は？",["送信者自身の秘密鍵","受信者の公開鍵","受信者の秘密鍵","送信者自身の公開鍵"],1,"受信者の公開鍵で暗号化し、対応する受信者の秘密鍵で復号する。送信者の秘密鍵を使う電子署名とは目的が異なる。"],["【データ活用】あるクラスのアンケートで回答者の80%が「賛成」と答えた。全校生徒も80%が賛成と結論づける際の問題は？",["数字がある","割合を使っている","回答者が全校を代表するとは限らない","アンケートである"],2,"回答者の選ばれ方や回答数が偏っていると全校に一般化できない。"],["【プログラミング】変数xが3で、処理 x←x+2 を実行した後のxは？",["1","3","6","5"],3,"xの値3に2を加えるので5。"],["【ネットワーク】HTTPSを利用する主な利点は？",["通信を暗号化し盗聴・改ざんのリスクを低減する","相手が必ず善人だと保証する","ウイルスを必ず除去する","パスワード入力が不要になる"],0,"HTTPSは通信を暗号化し、サーバー認証などを通じて通信の安全性を高める。"],["【情報デザイン】比較する数値を棒グラフで示す際に重要なのは？",["都合のよい値だけ隠す","軸・単位・尺度を明示する","単位を混在させる","目盛りを説明しない"],1,"軸や単位、尺度を明示すると、読み手が適切に比較できる。"],["【プログラムトレース】x=2から始め、iを1から3まで1ずつ増やしながら毎回 x←x+i を実行する。最後のxは？",["5","6","8","7"],2,"順にx=3、5、8となる。ループを1回ずつ追い、更新後の値を記録する。"],["【アルゴリズム】入力値xが0以上なら「非負」、0未満なら「負」と表示する条件分岐は？",["if x>0 then 非負 else 負","常に非負と表示する","if x<0 then 非負 else 非負","if x>=0 then 非負 else 負"],3,"0も非負に含まれるので、条件は x>=0。境界値0で動作を確認する。"],["【データ分析】データに極端に大きい値が1つ含まれる場合、中心の代表値として影響を受けにくいものは？",["中央値","平均値","最大値","合計値"],0,"中央値は並べたときの中央の値で、極端な外れ値の影響を平均値より受けにくい。"],["【情報セキュリティ】パスワードが漏えいした場合の被害を減らす対策として適切なのは？",["すべてのサービスで同じパスワードを使う","多要素認証を有効にする","パスワードを友人と共有する","更新通知をすべて無視する"],1,"多要素認証は、パスワード以外の要素も確認するため、不正ログインのリスク低減に役立つ。"],["【ネットワーク・プロトコル】DNSの主な役割は？",["端末の電池を充電する","画像を必ず圧縮する","ドメイン名とIPアドレスの対応を調べる","すべての通信を暗号化する"],2,"DNSはドメイン名に対応するIPアドレスなどを問い合わせる仕組み。通信の暗号化はDNSそのものの役割ではない。"],["【情報デザイン・共通テスト】2つの商品の売上を月ごとに比較するグラフで、誤解を減らす工夫は？",["凡例をなくして色だけで示す","比較しやすいよう片方のデータを隠す","縦軸を説明なく途中から始める","縦軸の単位・目盛りと期間を明示する"],3,"軸の単位・目盛り、期間、凡例を明示し、尺度の取り方で差を誇張しないことが大切。"],["【2進数】2進数 1101₂ を10進数にすると？",["13","12","11","14"],0,"1101₂=1×8+1×4+0×2+1=13。"],["【論理演算】A=1、B=0のとき、A AND B の値は？",["1","0","2","定義されない"],1,"ANDは両方が1のときだけ1。A=1、B=0なので0。"],["【論理演算】A=0のとき、NOT A の値は？",["0","Aのまま","1","定義されない"],2,"NOTは真偽を反転するので、0の否定は1。"],["【データ表現】8ビットで表せる異なるビット列は何通り？",["8","16","128","256"],3,"各ビットに0か1の2通りがあり、2⁸=256通り。"],["【画像データ】横100画素、縦50画素、1画素あたり24ビットの非圧縮画像のデータ量は？",["120,000ビット","12,000ビット","1,200,000ビット","12,000バイト"],0,"100×50×24=120,000ビット。ファイル形式の付加情報などは含めない。"],["【圧縮】元のデータを完全に復元できる圧縮方式は？",["非可逆圧縮","可逆圧縮","暗号化","標本化"],1,"可逆圧縮は圧縮前のデータを完全に復元できる。"],["【データベース】表の中で各レコードを一意に識別するために使う項目は？",["見出し画像","外部リンク","主キー","コメント欄"],2,"主キーは各レコードを重複なく識別するための項目。"],["【著作権】他人の文章や画像を利用するときに適切なのは？",["ネット上なら自由に転載する","加工すれば必ず自由に使える","作者名を消して使う","出典や利用条件を確認し、必要な許諾を得る"],3,"公開されているだけで自由利用できるとは限らない。権利やライセンス、引用条件を確認する。"],["【暗号】共通鍵暗号方式の特徴として正しいものは？",["暗号化と復号に同じ鍵を使う","鍵を一切使わない","必ず公開鍵と秘密鍵の2本を使う","データを圧縮するだけの方式"],0,"共通鍵暗号では暗号化と復号に同じ共通鍵を使う。鍵の安全な共有が重要。"],["【ネットワーク】パケット交換方式の説明として適切なのは？",["通信中は必ず専用回線を占有する","データを小さな単位に分けて送り、受信側で組み立てる","通信内容を必ず印刷する","IPアドレスを使わない方式"],1,"データをパケットに分けて送信し、受信側で再構成する方式。"],["【プログラム】x=0として、i=1,2,3の順に x←x+2 を実行した後のxは？",["2","3","6","5"],2,"2を3回加えるのでx=6。"],["【情報デザイン】数値の変化を時間順に示すとき、一般に向いているグラフは？",["散布図だけ","円グラフだけ","地図記号","折れ線グラフ"],3,"時間に沿った変化や傾向を示すには折れ線グラフが適している。"],["【プログラムトレース】x=4 とする。次に x=x×3、x=x−5 を順に実行した後のxは？",["7","5","12","17"],0,"最初に4×3=12、次に12−5=7となる。"],["【アルゴリズム】iを1から3まで1ずつ増やし、各回で合計に2iを加える。合計の最終値は？",["6","12","9","18"],1,"合計は2×1+2×2+2×3=2+4+6=12。"],["【条件分岐】score=75 とし、「scoreが80以上ならA、そうでなければB」とする。表示される文字は？",["A","75","B","エラー"],2,"75は80以上ではないので、else側のBが表示される。"],["【2進数計算】2進数 10110₂ を10進数に変換すると？",["18","20","24","22"],3,"1×2⁴+0×2³+1×2²+1×2¹+0×2⁰=16+4+2=22。"],["【表計算】セルB2〜B4に12、18、20が入力されている。合計を求めた値は？",["50","38","30","60"],0,"合計は12+18+20=50。範囲を合計するには=SUM(B2:B4)を使う。"],["【論理演算】A=0、B=1 のとき、A OR B の結果は？",["1","0","10","定義できない"],0,"ORは少なくとも一方が1なら1になるため、0 OR 1 は1。"]]; 

/* Per-question difficulty labels for the dedicated difficulty practice.
   Existing basic indices are retained; the remaining original items are standard.
   New applied questions are deliberately written for the advanced band. */
const BASIC_DIFFICULTY_INDICES=[0,2,3,4,5,8,9,11,13,14,17,18,19,21,22,23,24,27,30,33];
BANK.forEach((q,i)=>q.push(BASIC_DIFFICULTY_INDICES.includes(i)?1:2));
const ADVANCED_INFO_QUESTIONS=[
["【応用・データ分析】全校生徒の学年構成は1年40％、2年35％、3年25％である。各学年内での賛成率をそれぞれ60％、80％、50％と見積もれた。学年構成を反映した全校の賛成率の推定値として最も適切なのは？",["61.0％","64.5％","70.0％","75.0％"],1,"学年構成で加重平均する。0.40×0.60＋0.35×0.80＋0.25×0.50＝0.645なので64.5％。単純平均ではなく、各学年の構成比を重みにする。",3],
["【応用・プログラム】次の処理を実行する。count=0 とし、scores=[58,72,85,72,91] の各値について、70以上ならcountを1増やし、さらに80以上ならcountをもう1増やす。処理終了時のcountは？",["4","5","6","7"],2,"70以上は72、85、72、91の4件。さらに80以上の85、91の2件も追加で数えるため、合計6。条件が重なるとき、両方の処理が実行される点に注意する。",3],
["【応用・情報セキュリティ】学校が成績データを公開する際、氏名を削除したうえで「学年・部活動・得点」を掲載した。部員が1人しかいない部活動では、周囲の情報から本人が推測できる可能性がある。最も適切な改善は？",["氏名だけ削除すれば十分と判断する","公開する項目を増やして情報量を保つ","少人数区分をまとめる・非表示にするなど、組合せによる特定可能性も確認する","ファイル名を変更して公開する"],2,"直接識別子を消しても、属性の組合せや少人数の集計から個人が推測されることがある。区分の統合や少数セルの抑制などを検討する。",3],
["【応用・データ表現】A地区は人口2万人で事故が20件、B地区は人口8万人で事故が48件だった。人口規模の違いを考慮して比較する方法として最も適切なのは？",["事故件数だけを比較し、B地区の危険性が高いと判断する","人口1万人当たりの事故件数を計算して比較する","人口の多い地区の件数を必ず半分にする","2地区の人口を足して事故件数で割る"],1,"A地区は人口1万人当たり10件、B地区は6件。総件数だけでは人口規模の違いを反映できないため、人口当たりの率で比べる。",3],
["【応用・論理演算】条件AまたはBのどちらかが成立したときに処理を止める。処理を続ける条件として、これと論理的に同値なものは？",["NOT A OR NOT B","A AND B","NOT A AND NOT B","A OR B"],2,"「AまたはB」が成立しない条件は、その否定である NOT(A OR B)。ド・モルガンの法則により NOT A AND NOT B と同値。",3],

    const options = Array.isArray(q[1]) ? q[1] : [];
    return material + "問題 " + (i + 1) + "\n" + String(q[0] || "") + "\n" + options.map((v, j) => String.fromCharCode(65 + j) + ". " + String(v)).join("\n");
  }).join("\n\n");
  const answerText = questions.map((q, i) => "問題 " + (i + 1) + "\n" + String(q[0] || "") + "\n正解：" + String((q[1] || [])[q[2]] ?? "未設定") + "\n解説：" + String(q[3] || "解説未設定")).join("\n\n");
  const text = kind === "questions" ? title + "\n問題\n" + questionText : kind === "answers" ? title + "\n解答・解説\n" + answerText : title + "\n問題\n" + questionText + "\n\n解答・解説\n" + answerText;
  try {
    if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
    else {
      const area = document.createElement("textarea"); area.value = text; area.setAttribute("readonly", "");
      area.style.position = "fixed"; area.style.opacity = "0"; document.body.appendChild(area); area.select();
      const copied = document.execCommand("copy"); area.remove(); if (!copied) throw new Error("Clipboard API unavailable");
    }
    if (status) status.textContent = kind === "questions" ? "問題のみのテキストをコピーしました。" : kind === "answers" ? "解答・解説のテキストをコピーしました。" : "問題と解答・解説のテキストをコピーしました。";
  } catch (error) { if (status) status.textContent = "自動コピーできませんでした。ブラウザの権限を確認してください。"; }
}
function exportPracticePdf(kind){
 if(!Array.isArray(questions)||!questions.length){alert("先に演習を開始してください。");return;}
 const mode=$("mode").value,title=document.querySelector("h1")?.textContent||"演習",stamp=new Date().toLocaleDateString("ja-JP");
 let body="",lastStimulus="";
 const renderStimulus=q=>{const st=pdfStimulusFor(q,mode);if(!st)return "";const key=mode+":"+String(q[4]??"shared");if(key===lastStimulus)return "";lastStimulus=key;return '<section class="stimulus"><h2>'+pdfEscape(st.title||"資料")+'</h2><p>'+pdfEscape(st.text||"")+'</p><div>'+String(st.table||"")+'</div></section>';};
 const qhtml=(q,i)=>'<article class="question"><h3>問題 '+(i+1)+'</h3><p class="prompt">'+pdfEscape(q[0])+'</p><ol type="A">'+(Array.isArray(q[1])?q[1]:[]).map(v=>'<li>'+pdfEscape(v)+'</li>').join("")+'</ol></article>';
 const ahtml=(q,i)=>'<article class="answer"><h3>問題 '+(i+1)+'</h3><p><strong>'+pdfEscape(q[0])+'</strong></p><p><strong>正解：</strong>'+pdfEscape((q[1]||[])[q[2]]??"未設定")+'</p><p><strong>解説：</strong>'+pdfEscape(q[3]||"解説未設定")+'</p></article>';
 if(kind!=="answers"){body+='<h1>問題</h1><p class="meta">'+pdfEscape(title)+' · '+stamp+' · '+questions.length+'問</p>';questions.forEach((q,i)=>{body+=renderStimulus(q)+qhtml(q,i);});}
 if(kind==="answers"){body+='<h1>解答・解説</h1><p class="meta">'+pdfEscape(title)+' · '+stamp+' · '+questions.length+'問</p>';questions.forEach((q,i)=>{body+=ahtml(q,i);});}
 if(kind==="combined"){body+='<section class="answer-key"><h1>解答・解説</h1><p class="meta">問題編の後に解答を掲載</p>';questions.forEach((q,i)=>{body+=ahtml(q,i);});body+='</section>';}
 const win=window.open("","_blank");if(!win){alert("印刷用ウィンドウが開けません。ポップアップを許可して再試行してください。");return;}
 win.document.open();win.document.write('<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+pdfEscape(title)+' PDF</title><style>@media print{body{font:12pt/1.65 system-ui,-apple-system,sans-serif;color:#111;margin:18mm}h1{font-size:20pt;border-bottom:2px solid #333;padding-bottom:4mm}h2{font-size:15pt}h3{font-size:12pt;margin:0 0 3mm}.meta{color:#555;font-size:10pt}.stimulus{border:1px solid #999;padding:5mm;margin:7mm 0;break-inside:avoid}.stimulus table{border-collapse:collapse;width:100%;margin:4mm 0}.stimulus th,.stimulus td{border:1px solid #777;padding:2mm;text-align:left}.question,.answer{margin:5mm 0;padding:4mm 0;border-bottom:1px solid #bbb;break-inside:avoid}.prompt{white-space:pre-wrap}.answer-key{break-before:page}@page{size:A4;margin:14mm}}</style></head><body>'+body+'<script>window.addEventListener("load",()=>setTimeout(()=>window.print(),250));<\/script></body></html>');win.document.close();
}
$("pdfQuestions").addEventListener("click",()=>exportPracticePdf("questions"));
$("pdfAnswers").addEventListener("click",()=>exportPracticePdf("answers"));
$("pdfCombined").addEventListener("click",()=>exportPracticePdf("combined"));$("copyQuestions").addEventListener("click",()=>copyPracticeText("questions"));
$("copyAnswers").addEventListener("click",()=>copyPracticeText("answers"));
$("copyCombined").addEventListener("click",()=>copyPracticeText("combined"));
</script></body></html>

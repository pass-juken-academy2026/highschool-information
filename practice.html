const BANK=[["個人情報を扱う際に適切な行動は？",["必要な範囲だけ収集し目的を明確にする","本人に知らせず無制限に公開する","パスワードを全員に共有する","公開範囲を毎回最大にする"],0,"個人情報は利用目的や必要性を考え、適切に管理する。"],["2進数 101₂ を10進数にすると？",["3","5","4","6"],1,"1×2²+0×2¹+1×2⁰=5。"],["アルゴリズムの説明として適切なのは？",["必ずプログラミング言語の名前","データを保存する機器だけ","問題を解くための手順","画像の解像度"],2,"アルゴリズムは問題を解決するための明確な手順。"],["表計算でセルA1からA5の合計を求める関数は？",["=ADD(A1-A5)","=COUNT(A1:A5)","=TOTAL(A1;A5)","=SUM(A1:A5)"],3,"SUM関数で指定範囲の数値を合計する。"],["フィッシング詐欺への対策として最も適切なのは？",["送信元とURLを確認し、公式経路からアクセスする","メールのリンクをすぐ開いて入力する","同じパスワードを全サービスで使う","警告を無視する"],0,"不審なリンクを避け、公式アプリやブックマークから確認する。"],["公開鍵暗号方式の特徴として適切なのは？",["全員が同じ秘密鍵を必ず公開する","暗号化鍵と復号鍵に異なる鍵を用いる","暗号化を使わない","データのバックアップだけを指す"],1,"公開鍵と秘密鍵のペアを使う方式。"],["【データ活用】あるクラスのアンケートで回答者の80%が「賛成」と答えた。全校生徒も80%が賛成と結論づける際の問題は？",["数字がある","割合を使っている","回答者が全校を代表するとは限らない","アンケートである"],2,"回答者の選ばれ方や回答数が偏っていると全校に一般化できない。"],["【プログラミング】変数xが3で、処理 x←x+2 を実行した後のxは？",["1","3","6","5"],3,"xの値3に2を加えるので5。"],["【ネットワーク】HTTPSを利用する主な利点は？",["通信を暗号化し盗聴・改ざんのリスクを低減する","相手が必ず善人だと保証する","ウイルスを必ず除去する","パスワード入力が不要になる"],0,"HTTPSは通信を暗号化し、サーバー認証などを通じて通信の安全性を高める。"],["【情報デザイン】比較する数値を棒グラフで示す際に重要なのは？",["都合のよい値だけ隠す","軸・単位・尺度を明示する","単位を混在させる","目盛りを説明しない"],1,"軸や単位、尺度を明示すると、読み手が適切に比較できる。"],["【プログラムトレース】x=2から始め、iを1から3まで1ずつ増やしながら毎回 x←x+i を実行する。最後のxは？",["5","6","8","7"],2,"順にx=3、5、8となる。ループを1回ずつ追い、更新後の値を記録する。"],["【アルゴリズム】入力値xが0以上なら「非負」、0未満なら「負」と表示する条件分岐は？",["if x>0 then 非負 else 負","常に非負と表示する","if x<0 then 非負 else 非負","if x>=0 then 非負 else 負"],3,"0も非負に含まれるので、条件は x>=0。境界値0で動作を確認する。"],["【データ分析】データに極端に大きい値が1つ含まれる場合、中心の代表値として影響を受けにくいものは？",["中央値","平均値","最大値","合計値"],0,"中央値は並べたときの中央の値で、極端な外れ値の影響を平均値より受けにくい。"],["【情報セキュリティ】パスワードが漏えいした場合の被害を減らす対策として適切なのは？",["すべてのサービスで同じパスワードを使う","多要素認証を有効にする","パスワードを友人と共有する","更新通知をすべて無視する"],1,"多要素認証は、パスワード以外の要素も確認するため、不正ログインのリスク低減に役立つ。"],["【ネットワーク・プロトコル】DNSの主な役割は？",["端末の電池を充電する","画像を必ず圧縮する","ドメイン名とIPアドレスの対応を調べる","すべての通信を暗号化する"],2,"DNSはドメイン名に対応するIPアドレスなどを問い合わせる仕組み。通信の暗号化はDNSそのものの役割ではない。"],["【情報デザイン・共通テスト】2つの商品の売上を月ごとに比較するグラフで、誤解を減らす工夫は？",["凡例をなくして色だけで示す","比較しやすいよう片方のデータを隠す","縦軸を説明なく途中から始める","縦軸の単位・目盛りと期間を明示する"],3,"軸の単位・目盛り、期間、凡例を明示し、尺度の取り方で差を誇張しないことが大切。"],["【2進数】2進数 1101₂ を10進数にすると？",["13","12","11","14"],0,"1101₂=1×8+1×4+0×2+1=13。"],["【論理演算】A=1、B=0のとき、A AND B の値は？",["1","0","2","定義されない"],1,"ANDは両方が1のときだけ1。A=1、B=0なので0。"],["【論理演算】A=0のとき、NOT A の値は？",["0","Aのまま","1","定義されない"],2,"NOTは真偽を反転するので、0の否定は1。"],["【データ表現】8ビットで表せる異なるビット列は何通り？",["8","16","128","256"],3,"各ビットに0か1の2通りがあり、2⁸=256通り。"],["【画像データ】横100画素、縦50画素、1画素あたり24ビットの非圧縮画像のデータ量は？",["120,000ビット","12,000ビット","1,200,000ビット","12,000バイト"],0,"100×50×24=120,000ビット。ファイル形式の付加情報などは含めない。"],["【圧縮】元のデータを完全に復元できる圧縮方式は？",["非可逆圧縮","可逆圧縮","暗号化","標本化"],1,"可逆圧縮は圧縮前のデータを完全に復元できる。"],["【データベース】表の中で各レコードを一意に識別するために使う項目は？",["見出し画像","外部リンク","主キー","コメント欄"],2,"主キーは各レコードを重複なく識別するための項目。"],["【著作権】他人の文章や画像を利用するときに適切なのは？",["ネット上なら自由に転載する","加工すれば必ず自由に使える","作者名を消して使う","出典や利用条件を確認し、必要な許諾を得る"],3,"公開されているだけで自由利用できるとは限らない。権利やライセンス、引用条件を確認する。"],["【暗号】共通鍵暗号方式の特徴として正しいものは？",["暗号化と復号に同じ鍵を使う","鍵を一切使わない","必ず公開鍵と秘密鍵の2本を使う","データを圧縮するだけの方式"],0,"共通鍵暗号では暗号化と復号に同じ共通鍵を使う。鍵の安全な共有が重要。"],["【ネットワーク】パケット交換方式の説明として適切なのは？",["通信中は必ず専用回線を占有する","データを小さな単位に分けて送り、受信側で組み立てる","通信内容を必ず印刷する","IPアドレスを使わない方式"],1,"データをパケットに分けて送信し、受信側で再構成する方式。"],["【プログラム】x=0として、i=1,2,3の順に x←x+2 を実行した後のxは？",["2","3","6","5"],2,"2を3回加えるのでx=6。"],["【情報デザイン】数値の変化を時間順に示すとき、一般に向いているグラフは？",["散布図だけ","円グラフだけ","地図記号","折れ線グラフ"],3,"時間に沿った変化や傾向を示すには折れ線グラフが適している。"],["【プログラムトレース】x=4 とする。次に x=x×3、x=x−5 を順に実行した後のxは？",["7","5","12","17"],0,"最初に4×3=12、次に12−5=7となる。"],["【アルゴリズム】iを1から3まで1ずつ増やし、各回で合計に2iを加える。合計の最終値は？",["6","12","9","18"],1,"合計は2×1+2×2+2×3=2+4+6=12。"],["【条件分岐】score=75 とし、「scoreが80以上ならA、そうでなければB」とする。表示される文字は？",["A","75","B","エラー"],2,"75は80以上ではないので、else側のBが表示される。"],["【2進数計算】2進数 10110₂ を10進数に変換すると？",["18","20","24","22"],3,"1×2⁴+0×2³+1×2²+1×2¹+0×2⁰=16+4+2=22。"],["【表計算】セルB2〜B4に12、18、20が入力されている。合計を求めた値は？",["50","38","30","60"],0,"合計は12+18+20=50。範囲を合計するには=SUM(B2:B4)を使う。"],["【論理演算】A=0、B=1 のとき、A OR B の結果は？",["1","0","10","定義できない"],0,"ORは少なくとも一方が1なら1になるため、0 OR 1 は1。"]];

const COMMON_STIMULI=[{"title":"【資料A】学年別アンケートと回答の偏り","text":"生徒会は、昼休みに図書室前を通った生徒へ、放課後の自習室を利用したいか尋ねた。回答は1年生40人中24人、2年生50人中35人、3年生30人中15人が「利用したい」だった。担当者は「合計の賛成者数だけでなく、学年ごとの割合も比べたい」と考えている。一方、昼休みに図書室前を通らない生徒や、アンケートに回答しなかった生徒の意見は含まれていない。調査結果を全校生徒の希望として扱うには、回答者の選ばれ方や未回答者の存在を考慮し、対象者を広げて調べ直す必要がある。","table":"<table><tr><th>学年</th><th>回答者</th><th>利用希望</th></tr><tr><td>1年</td><td>40人</td><td>24人</td></tr><tr><td>2年</td><td>50人</td><td>35人</td></tr><tr><td>3年</td><td>30人</td><td>15人</td></tr></table>"},{"title":"【資料B】得点データを処理するプログラム","text":"担当教員は、小テストの得点を配列 scores に保存し、平均点と70点以上の人数を自動で求める処理を考えた。生徒の葵は「70点ちょうどの人も合格者に数えるのですか」と質問した。教員は「条件を score >= 70 と書けば70点を含む。score > 70 なら70点は含まれない」と説明した。プログラムでは、合計用の変数を最初に0にし、配列の各要素を一つずつ取り出して加算する。条件の境界や配列の要素数を取り違えると、計算結果が変わるため、入力と期待される結果を用意して確認することにした。","table":"<p><code>scores = [68, 74, 91, 70, 74]</code><br><code>total = 0</code><br><code>count = 0</code><br><code>for score in scores:</code><br><code>　total = total + score</code><br><code>　if score &gt;= 70: count = count + 1</code><br><code>average = total / len(scores)</code></p>"},{"title":"【資料C】配列の集計と繰り返し","text":"図書委員会は、5日間の貸出冊数を values = [4, 7, 2, 9, 7] として記録した。委員の健太は、5以上の値の個数を数えるプログラムを書いたが、繰り返しの条件を i < len(values) - 1 としてしまった。先生は「添字は0から始まるので、要素数が5なら有効な添字は0から4までだ。終了条件を一つ早くすると、最後の値を処理しない」と説明した。配列の集計では、初期値、添字の範囲、条件判定、更新の順を表にして追うと、見落としを防ぎやすい。","table":"<p><code>values = [4, 7, 2, 9, 7]</code><br><code>count = 0</code><br><code>for i in range(0, len(values)):</code><br><code>　if values[i] &gt;= 5:</code><br><code>　　count = count + 1</code></p>"},{"title":"【資料D】学校アンケートの安全な運用","text":"学校はオンラインで進路希望アンケートを集めることにした。回答は暗号化された通信でサーバーへ送られ、教員は担当学年の集計に必要な範囲だけ閲覧できる。公開する資料は原則として学年ごとの集計値とし、氏名や学籍番号は載せない方針である。ただし、回答者がごく少ない選択肢をそのまま公表すると、他の情報と照合されて個人が推測されるおそれがある。担当者は「通信を暗号化しただけで、保存データの管理や公開方法まで安全になるわけではない」と確認し、保存期間、アクセス権限、事故発生時の連絡手順も定めることにした。","table":"<p>検討項目：通信中の保護／保存データの保護／最小権限／保存期間／少人数集計の公開可否／事故時の対応。</p>"}];const COMMON_TEST=[["資料A｜回答者全体の人数は何人か。",["120人","110人","100人","130人"],0,"40＋50＋30＝120人。",0],["資料A｜利用希望者全体の割合に最も近いものは？",["55.0％","61.7％","65.0％","70.0％"],1,"希望者は24＋35＋15＝74人。74÷120×100≒61.7％。",0],["資料A｜学年別の利用希望率が最も高いのは？",["1年生","3年生","2年生","3学年とも同じ"],2,"1年生は60％、2年生は70％、3年生は50％なので2年生が最も高い。",0],["資料A｜この調査結果を全校生徒の希望と断定しにくい理由は？",["学年別に人数を分けているから","回答者が120人いるから","割合を計算できるから","昼休みに図書室前を通る生徒など、回答者が偏っている可能性がある"],3,"調査対象が特定の場所・時間に偏り、未回答者もいるため、全校を代表するとは限らない。",0],["資料A｜全校の希望をより適切に調べる方法は？",["各学年から無作為に対象者を選び、回答状況も記録する","賛成と答えた生徒だけに理由を尋ねる","回答数の少ない学年を調査対象から外す","図書室前に来た生徒だけに再度尋ねる"],0,"学年ごとの偏りを抑え、無作為抽出や未回答の状況を確認する方法が適切。",0],["資料B｜scoresの合計値はいくつか。",["357","377","367","387"],1,"68＋74＋91＋70＋74＝377。",1],["資料B｜averageの値はいくつか。",["70.4","72.4","75.4","77.4"],2,"合計377を5人で割ると75.4点。",1],["資料B｜score >= 70 の条件でcountに記録される人数は？",["2人","3人","5人","4人"],3,"74、91、70、74の4人が70点以上。",1],["資料B｜条件を score > 70 に変更した場合のcountは？",["3人","2人","1人","4人"],0,"70点を除く74、91、74の3人。",1],["資料B｜このプログラムの正しさを確かめる方法として最も適切なのは？",["結果が大きくなる入力だけを使う","入力例と期待する合計・人数を決め、実行結果と照合する","一度実行して動いたら確認を終える","エラーが出ないことだけを確認する"],1,"既知の入力と期待結果を用意し、合計と条件判定の両方を照合する。",1],["資料C｜valuesのうち5以上の値はいくつあるか。",["1個","2個","3個","4個"],2,"7、9、7の3個が5以上。",2],["資料C｜valuesの合計はいくつか。",["25","27","31","29"],3,"4＋7＋2＋9＋7＝29。",2],["資料C｜valuesを小さい順に並べたときの中央値は？",["7","4","7.5","9"],0,"2、4、7、7、9の中央の値は7。",2],["資料C｜i < len(values) - 1 を使うと、何が起こるか。",["最初の要素を処理しない","最後の要素を処理しない","全要素を2回処理する","配列の順序が必ず逆になる"],1,"要素数5の場合、iは0〜3までとなり、添字4の最後の要素を処理しない。",2],["資料C｜要素数5の配列を添字0から全て処理する範囲は？",["0から3まで","1から5まで","0から4まで","0から5まで"],2,"5個の要素の添字は0、1、2、3、4。",2],["資料D｜HTTPSなどの暗号化通信で主に保護されるものは？",["公開後の情報の再識別","サーバー内に保存された全データ","端末の故障","通信経路上で送受信されるデータ"],3,"暗号化通信は通信中のデータを保護するが、保存データや端末の安全を全て保証するものではない。",3],["資料D｜担当教員が閲覧できる情報を担当業務に必要な範囲に限定する原則は？",["最小権限の原則","公開優先の原則","全権限の原則","無期限保存の原則"],0,"最小権限の原則は、業務に必要な最小限のアクセス権限だけを付与する考え方。",3],["資料D｜回答者が少ない項目の集計値を公表する際に注意すべきことは？",["少人数でも必ず個別値を公開する","他の情報と照合して個人が推測されないか確認する","学籍番号を一緒に掲載する","公開後は削除できないと考える"],1,"少人数の集計値は、他の情報と組み合わせると個人を推測できる場合がある。",3],["資料D｜アンケートデータの保存について適切なのは？",["目的に関係なく永久保存する","全教員が自由に閲覧できるようにする","目的や必要性に応じて保存期間を定め、不要になった情報を適切に削除する","不要になっても削除しない"],2,"保存期間を定め、目的達成後に不要となった情報を適切に削除する。",3],["資料D｜情報漏えいが疑われる場合の初動として適切なのは？",["原因を確認せず全データを公開する","証拠を消してから考える","関係者に知らせず個人で隠す","状況を記録し、影響範囲を確認して定められた担当者へ速やかに報告する"],3,"記録・影響範囲の確認・所定の報告を行い、被害拡大を防ぐ手順につなげる。",3]];let commonExamTimerId=null,commonExamSeconds=3600;
function stopCommonExamTimer(){if(commonExamTimerId){clearInterval(commonExamTimerId);commonExamTimerId=null;}}
function startCommonExamTimer(){stopCommonExamTimer();commonExamSeconds=3600;let label=$("commonExamTimer");if(!label){label=document.createElement("p");label.id="commonExamTimer";label.style.cssText="margin:8px 0;padding:8px 12px;border:1px solid #94a3b8;border-radius:8px;font-weight:700";$("quiz").insertBefore(label,$("quiz").firstChild);}const tick=()=>{const m=Math.floor(commonExamSeconds/60),s=commonExamSeconds%60;label.textContent="共通テスト型・残り時間 "+m+":"+String(s).padStart(2,"0");if(commonExamSeconds<=0){stopCommonExamTimer();finish();return;}commonExamSeconds--;};tick();commonExamTimerId=setInterval(tick,1000);}
function start(list=null,review=false){stopCommonExamTimer();const mode=$("mode").value;let source=list||BANK;if(!list&&mode==="basic")source=BANK.slice(0,6);if(!list&&mode==="common")source=COMMON_TEST;if(!list&&mode==="mock")source=[...BANK];questions=(!list&&mode==="common")?[...source]:[...source].sort(()=>Math.random()-.5);if(!list&&mode==="mock")questions=questions.slice(0,20);if(!questions.length)questions=[...BANK];idx=0;answers=[];locked=false;reviewOnly=review;$("setup").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");$("pdfExportControls").classList.remove("hidden");render();if(!list&&mode==="common")startCommonExamTimer()}
function render(){const q=questions[idx];locked=false;$("counter").textContent=(idx+1)+" / "+questions.length;$("scoreLive").textContent="回答済み "+answers.filter(a=>a&&a.selected!==undefined).length+"問";$("bar").style.width=(idx/questions.length*100)+"%";const qel=$("question");let st=$("commonStimulus");if(!st){st=document.createElement("section");st.id="commonStimulus";st.className="panel";qel.parentNode.insertBefore(st,qel);}const cm=$("mode").value==="common";st.style.display=cm?"block":"none";const stimulus=COMMON_STIMULI[q[4]??0]||COMMON_STIMULI[0];st.innerHTML=cm?"<h3>"+stimulus.title+"</h3><p>"+stimulus.text+"</p>"+stimulus.table:"";$("question").textContent=q[0];$("choices").innerHTML="";q[1].forEach((t,i)=>{const b=document.createElement("button");b.className="choice";b.textContent=["A","B","C","D"][i]+"．"+t;b.addEventListener("click",()=>{if(locked)return;answers[idx]={selected:i};[...$("choices").children].forEach(x=>x.classList.remove("selected"));b.classList.add("selected")});$("choices").appendChild(b)});$("feedback").classList.add("hidden");$("feedback").textContent="";$("check").disabled=false;$("next").disabled=true;$("next").textContent=idx===questions.length-1?"結果を見る":"次の問題 →"}
$("start").addEventListener("click",()=>start());
$("check").addEventListener("click",()=>{if(locked)return;if(!answers[idx]||answers[idx].selected===undefined){$("feedback").textContent="選択肢を選んでね。";$("feedback").classList.remove("hidden");return}locked=true;const q=questions[idx],a=answers[idx];a.correct=a.selected===q[2];[...$("choices").children].forEach((b,i)=>{b.disabled=true;if(i===q[2])b.classList.add("correct");if(i===a.selected&&i!==q[2])b.classList.add("wrong")});$("feedback").textContent=(a.correct?"正解！":"不正解。正解は "+["A","B","C","D"][q[2]]+"。")+" "+q[3];$("feedback").classList.remove("hidden");$("check").disabled=true;$("next").disabled=false;$("scoreLive").textContent="現在 "+answers.filter(x=>x&&x.correct).length+"問正解"});
$("next").addEventListener("click",()=>{if(idx<questions.length-1){idx++;render()}else finish()});
function finish(){stopCommonExamTimer(); $("quiz").classList.add("hidden");$("result").classList.remove("hidden");const good=answers.filter(a=>a&&a.correct).length;const wrong=questions.map((q,i)=>({q,a:answers[i]})).filter(x=>!x.a||!x.a.correct);$("summary").textContent=good+" / "+questions.length+"問正解（正答率 "+Math.round(good/questions.length*100)+"%）";$("analysis").textContent=good===questions.length?"全問正解！知識だけでなく、根拠を説明できるかも確認しよう。":wrong.length+"問を復習リストに入れました。解説を読み、なぜその選択肢が正しいかを自分の言葉で説明してみよう。";$("missed").innerHTML=wrong.length?wrong.map(x=>'<div class="explain" style="margin:10px 0"><strong>'+pdfEscape(x.q[0]) +'</strong><p>正解：'+pdfEscape((x.q[1]||[])[x.q[2]]??"未設定")+'</p><p>'+pdfEscape(x.q[3]||"") +'</p></div>').join(""):"間違えた問題はありません。";$("review").disabled=!wrong.length;$("review").onclick=()=>start(wrong.map(x=>x.q),true);$("again").onclick=()=>start()}

function pdfEscape(value){return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function pdfStimulusFor(q,mode){if(mode!=="common")return null;const n=Number(q[4]??0);return COMMON_STIMULI[Math.max(0,Math.min(COMMON_STIMULI.length-1,n))]||COMMON_STIMULI[0]||null;}
async function copyPracticeText(kind) {
  const status = $("copyTextStatus");
  if (!Array.isArray(questions) || !questions.length) {
    if (status) status.textContent = "先に演習を開始してください。";
    return;
  }
  const modeNow = $("mode").value;
  const title = document.querySelector("h1")?.textContent || "演習";
  const toPlainText = html => { const box = document.createElement("div"); box.innerHTML = String(html || ""); return (box.textContent || "").trim(); };
  let lastStimulus = "";
  const questionText = questions.map((q, i) => {
    let material = "";
    const st = pdfStimulusFor(q, modeNow);
    const key = modeNow + ":" + String(q[4] ?? "shared");
    if (st && key !== lastStimulus) material = "【資料】" + String(st.title || "") + "\n" + String(st.text || "") + "\n" + toPlainText(st.table) + "\n";
    lastStimulus = key;
    const options = Array.isArray(q[1]) ? q[1] : [];
    return material + "問題 " + (i + 1) + "\n" + String(q[0] || "") + "\n" + options.map((v, j) => String.fromCharCode(65 + j) + ". " + String(v)).join("\n");
  }).join("\n\n");
  const answerText = questions.map((q, i) => "問題 " + (i + 1) + "\n" + String(q[0] || "") + "\n正解：" + String((q[1] || [])[q[2]] ?? "未設定") + "\n解説：" + String(q[3] || "解説未設定")).join("\n\n");
  const text = kind === "questions" ? title + "\n問題\n" + questionText : kind === "answers" ? title + "\n解答・解説\n" + answerText : title + "\n問題\n" + questionText + "\n\n解答・解説\n" + answerText;
  try {
    if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
    else {
      const area = document.createElement("textarea"); area.value = text; area.setAttribute("readonly", "");
      area.style.position = "fixed"; area.style.opacity = "0"; document.body.appendChild(area); area.select();
      const copied = document.execCommand("copy"); area.remove(); if (!copied) throw new Error("Clipboard API unavailable");
    }
    if (status) status.textContent = kind === "questions" ? "問題のみのテキストをコピーしました。" : kind === "answers" ? "解答・解説のテキストをコピーしました。" : "問題と解答・解説のテキストをコピーしました。";
  } catch (error) { if (status) status.textContent = "自動コピーできませんでした。ブラウザの権限を確認してください。"; }
}
function exportPracticePdf(kind){
 if(!Array.isArray(questions)||!questions.length){alert("先に演習を開始してください。");return;}
 const mode=$("mode").value,title=document.querySelector("h1")?.textContent||"演習",stamp=new Date().toLocaleDateString("ja-JP");
 let body="",lastStimulus="";
 const renderStimulus=q=>{const st=pdfStimulusFor(q,mode);if(!st)return "";const key=mode+":"+String(q[4]??"shared");if(key===lastStimulus)return "";lastStimulus=key;return '<section class="stimulus"><h2>'+pdfEscape(st.title||"資料")+'</h2><p>'+pdfEscape(st.text||"")+'</p><div>'+String(st.table||"")+'</div></section>';};
 const qhtml=(q,i)=>'<article class="question"><h3>問題 '+(i+1)+'</h3><p class="prompt">'+pdfEscape(q[0])+'</p><ol type="A">'+(Array.isArray(q[1])?q[1]:[]).map(v=>'<li>'+pdfEscape(v)+'</li>').join("")+'</ol></article>';
 const ahtml=(q,i)=>'<article class="answer"><h3>問題 '+(i+1)+'</h3><p><strong>'+pdfEscape(q[0])+'</strong></p><p><strong>正解：</strong>'+pdfEscape((q[1]||[])[q[2]]??"未設定")+'</p><p><strong>解説：</strong>'+pdfEscape(q[3]||"解説未設定")+'</p></article>';
 if(kind!=="answers"){body+='<h1>問題</h1><p class="meta">'+pdfEscape(title)+' · '+stamp+' · '+questions.length+'問</p>';questions.forEach((q,i)=>{body+=renderStimulus(q)+qhtml(q,i);});}
 if(kind==="answers"){body+='<h1>解答・解説</h1><p class="meta">'+pdfEscape(title)+' · '+stamp+' · '+questions.length+'問</p>';questions.forEach((q,i)=>{body+=ahtml(q,i);});}
 if(kind==="combined"){body+='<section class="answer-key"><h1>解答・解説</h1><p class="meta">問題編の後に解答を掲載</p>';questions.forEach((q,i)=>{body+=ahtml(q,i);});body+='</section>';}
 const win=window.open("","_blank");if(!win){alert("印刷用ウィンドウが開けません。ポップアップを許可して再試行してください。");return;}
 win.document.open();win.document.write('<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+pdfEscape(title)+' PDF</title><style>@media print{body{font:12pt/1.65 system-ui,-apple-system,sans-serif;color:#111;margin:18mm}h1{font-size:20pt;border-bottom:2px solid #333;padding-bottom:4mm}h2{font-size:15pt}h3{font-size:12pt;margin:0 0 3mm}.meta{color:#555;font-size:10pt}.stimulus{border:1px solid #999;padding:5mm;margin:7mm 0;break-inside:avoid}.stimulus table{border-collapse:collapse;width:100%;margin:4mm 0}.stimulus th,.stimulus td{border:1px solid #777;padding:2mm;text-align:left}.question,.answer{margin:5mm 0;padding:4mm 0;border-bottom:1px solid #bbb;break-inside:avoid}.prompt{white-space:pre-wrap}.answer-key{break-before:page}@page{size:A4;margin:14mm}}</style></head><body>'+body+'<script>window.addEventListener("load",()=>setTimeout(()=>window.print(),250));<\/script></body></html>');win.document.close();
}
